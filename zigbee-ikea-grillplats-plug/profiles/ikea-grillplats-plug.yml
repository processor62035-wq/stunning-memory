name: ikea-grillplats-plug
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: currentMeasurement
    version: 1
  - id: powerMeter
    version: 1
  - id: voltageMeasurement
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: SmartPlug
preferences:
- name: pollMode
  title: 측정값 갱신 방식
  description: 전류·소모 전력·전압의 자동 갱신 방식을 선택합니다.
  required: true
  preferenceType: enumeration
  definition:
    options:
      "variable_5_10": "가변 (5~10초 가변)"
      "variable_5_30": "가변 (5~30초 가변)"
      "fixed_5": "5초, 고정"
      "fixed_10": "10초, 고정"
      "fixed_30": "30초, 고정"
      "fixed_60": "60초, 고정"
      "manual": "사용안함 (수동전용)"
    default: "variable_5_10"
- name: voltageMode
  title: 전압값 방식
  description: 센서 전압을 사용하거나 설정한 고정 전압을 사용합니다.
  required: true
  preferenceType: enumeration
  definition:
    options:
      "auto": "센서 우선, 없으면 고정값"
      "fixed": "고정값 사용"
    default: "auto"
- name: fixedVoltage
  title: 고정 전압
  description: 전압 센서가 없을 때 전류·전력 계산에 사용할 전압입니다.
  required: true
  preferenceType: number
  definition:
    minimum: 100
    maximum: 300
    default: 230
