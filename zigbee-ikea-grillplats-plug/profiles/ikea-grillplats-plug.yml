  capabilities:
  - id: switch
    version: 1
  - id: currentMeasurement
    version: 1
  - id: powerMeter
    version: 1
  - id: voltageMeasurement
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: SmartPlug
preferences:
- name: pollMode
  title: 측정값 갱신 방식
