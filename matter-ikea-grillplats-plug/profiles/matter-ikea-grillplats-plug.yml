name: matter-ikea-grillplats-plug
preferences:
  - name: voltageAlarmEnabled
    title: "전압 이상 즉시 경보"
    description: "전압이 평균 기준을 벗어나면 지속 시간과 관계없이 즉시 경보 상태를 발생시킵니다."
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: voltageAlarmTolerance
    title: "전압 경보 허용 범위"
    description: "최근 정상 전압 평균값을 기준으로 허용할 범위입니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        "5": "평균값의 ±5%"
        "10": "평균값의 ±10%"
      default: "10"
  - name: voltageAlarmMode
    title: "전압 이상 알람 방식"
    description: "설정 범위를 벗어났을 때 사용할 알람 방식입니다. 자동 차단 직전에는 사이렌이 우선합니다."
    required: true
    preferenceType: enumeration
    definition:
      options:
        off: "꺼짐"
        strobe: "스트로브"
        both: "사이렌 및 스트로브"
        siren: "사이렌"
      default: strobe
  - name: voltageAutoOffEnabled
    title: "전압 이상 자동 차단"
    description: "평균값 대비 ±15% 이상이 15초 지속되면 차단하고, ±20% 이상이면 즉시 차단합니다."
    required: true
    preferenceType: boolean
    definition:
      default: true
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: powerMeter
    version: 1
  - id: energyMeter
    version: 1
  - id: powerConsumptionReport
    version: 1
  - id: voltageMeasurement
    version: 1
  - id: currentMeasurement
    version: 1
  - id: refresh
    version: 1
  - id: alarm
    version: 1
  categories:
  - name: SmartPlug
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: switch
        version: 1
        group: main
        composite: true
      - component: main
        capability: powerMeter
        version: 1
        group: main
        values:
          - label: " | {{power.value}} {{power.unit}}"
        composite: true
      - component: main
        capability: voltageMeasurement
        version: 1
        group: main
        values:
          - label: " | {{voltage.value}} {{voltage.unit}}"
        composite: true
      - component: main
        capability: currentMeasurement
        version: 1
        group: main
        values:
          - label: " | {{current.value}} A"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
        group: main
        composite: true
    basicPlus: []
  detailView:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: powerMeter
      version: 1
    - component: main
      capability: voltageMeasurement
      version: 1
    - component: main
      capability: currentMeasurement
      version: 1
    - component: main
      capability: energyMeter
      version: 1
    - component: main
      capability: powerConsumptionReport
      version: 1
    - component: main
      capability: refresh
      version: 1
  automation:
    conditions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: powerMeter
        version: 1
      - component: main
        capability: voltageMeasurement
        version: 1
      - component: main
        capability: currentMeasurement
        version: 1
      - component: main
        capability: energyMeter
        version: 1
      - component: main
        capability: powerConsumptionReport
        version: 1
      - component: main
        capability: alarm
        version: 1
    actions:
      - component: main
        capability: switch
        version: 1
