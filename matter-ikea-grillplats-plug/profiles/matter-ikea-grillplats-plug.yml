name: matter-ikea-grillplats-plug
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: powerMeter
    version: 1
  - id: energyMeter
    version: 1
  - id: powerConsumptionReport
    version: 1
  - id: voltageMeasurement
    version: 1
  - id: currentMeasurement
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: SmartPlug
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: switch
        version: 1
        group: main
        composite: true
      - component: main
        capability: powerMeter
        version: 1
        group: main
        values:
          - label: " | {{power.value}} {{power.unit}}"
        composite: true
      - component: main
        capability: voltageMeasurement
        version: 1
        group: main
        values:
          - label: " | {{voltage.value}} {{voltage.unit}}"
        composite: true
      - component: main
        capability: currentMeasurement
        version: 1
        group: main
        values:
          - label: " | {{current.value}} {{current.unit}}"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
        group: main
        composite: true
    basicPlus: []
  detailView:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: powerMeter
      version: 1
    - component: main
      capability: voltageMeasurement
      version: 1
    - component: main
      capability: currentMeasurement
      version: 1
    - component: main
      capability: energyMeter
      version: 1
    - component: main
      capability: powerConsumptionReport
      version: 1
    - component: main
      capability: refresh
      version: 1
